  - name: Pharma
    symbol: "INDEX:NIFTY PHARMA"
  - name: FMCG
    symbol: "INDEX:NIFTY FMCG"
  - name: Metal
    symbol: "INDEX:NIFTY METAL"
  - name: Realty
    symbol: "INDEX:NIFTY REALTY"
