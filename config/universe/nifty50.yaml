# (https://nsearchives.nseindia.com/content/indices/ind_nifty50list.csv, checked 2026-09-26) with the September 2026
# review applied (BSE in, WIPRO out, effective 2026-09-30: https://www.niftyindices.com/Press_Release/ind_prs10082026.pdf).
