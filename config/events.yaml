# Event calendar and event risk (plan M3.3, docs/events.md). Loaded like config/regime.yaml.
hejje:
  events:
    enabled: true
    refresh-on-startup: true
    horizon-days: 60
    risk:
      macro-high-within-minutes: 60   # macro event starting within this -> HIGH; the rest of the day MEDIUM
      macro-in-progress-minutes: 30   # a timed macro event stays "in progress" (HIGH) this long after it starts
      earnings-heavy-count: 5         # results events on a session at or above which the regime environment is EARNINGS_HEAVY
    computed:
      enabled: true
      expiry-underlyings: [NIFTY, BANKNIFTY]
      # the session whose close the semi-annual NSE Indices reconstitution trades at (the day before the effective date):
      # March 2026 effective 30 Mar (https://www.niftyindices.com/Press_Release/ind_prs23022026.pdf), September 2026
      # effective 30 Sep (https://www.niftyindices.com/Press_Release/ind_prs10082026.pdf); add March 2027 when announced
      index-rebalance-dates: [2026-03-27, 2026-09-29]
    curated:
      enabled: true
      files:
        - classpath:events/macro-2026.yaml   # or file:./config/events/macro-2026.yaml
    nse:
      enabled: false                  # best-effort NSE corporate-action / board-meeting feeds; CSV import is the reliable path
      base-url: https://www.nseindia.com
      timeout-seconds: 5
