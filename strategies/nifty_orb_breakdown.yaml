# NIFTY 15-minute opening range breakdown, short only (docs/strategies/nifty_orb_breakdown.md)
name: nifty_orb_breakdown
family: index
description: Short breakdown below the first 15 minutes' low on the NIFTY front-month future, confirmed by VWAP and volume.

universe:
  - NIFTY

timeframe: 5m
direction: short

entry:
  all:
    - close < opening_range_low(15m)
    - close < vwap
    - relative_volume(20) > 1.2

stop:
  type: opening_range_high

target:
  type: risk_multiple
  value: 2

trade_window:
  start: "09:30"
  end: "12:00"

force_exit_time: "15:10"
max_trades_per_day: 1

position_sizing:
  type: risk_based
  risk_rupees: 2000

regime_preferences:
  trending: preferred
  ranging: avoid
  volatile: neutral

event_rules:
  high_risk_event_within_minutes: 15
  action: block
