  - NSE:SUNPHARMA
  - NSE:TATACONSUM
  - NSE:TATAMOTORS
  - NSE:TATASTEEL
  - NSE:TCS
  - NSE:TECHM
  - NSE:TITAN
  - NSE:TRENT
  - NSE:ULTRACEMCO
  - NSE:WIPRO

timeframe: 5m
direction: long

entry:
  all:
    - gap_pct > 1
    - close > opening_range_high(5m)
    - relative_volume(20) > 2
    - close > vwap

stop:
  type: atr_multiple
  value: 1.5

target:
  type: none

trade_window:
  start: "09:20"
  end: "10:30"

force_exit_time: "15:10"
max_trades_per_day: 1

position_sizing:
  type: risk_based
  risk_rupees: 1500

regime_preferences:
  trending: preferred
  gap_up: preferred
  ranging: avoid

event_rules:
  high_risk_event_within_minutes: 15
  action: block
