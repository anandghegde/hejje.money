# 5-minute opening range breakout on stocks in play, long only (docs/strategies/stock_in_play_orb.md)
name: stock_in_play_orb
family: trend
description: Buy a NIFTY 50 stock that gapped up over 1 % and breaks its first 5-minute high on more than twice its usual volume, above VWAP; held to the force exit.

universe:
  - NSE:ADANIENT
  - NSE:ADANIPORTS
  - NSE:APOLLOHOSP
  - NSE:ASIANPAINT
  - NSE:AXISBANK
  - NSE:BAJAJ-AUTO
