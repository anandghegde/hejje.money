name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Testcontainers uses the runner's Docker)
        working-directory: server
        run: ./gradlew build --no-daemon

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: tui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/hejje

  e2e:
    # Playwright specs in web/tests-e2e against the boot jar in the dev profile (fake broker, PAPER, dev seeding) with the
    # fixture LLM (agent-chat) and ratings/analogs on nifty50 (context); playwright.config.ts starts the Vite dev server,
    # which proxies /api and /ws to :8080. Recipe: docs/web.md, "Tests".
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hejje
          POSTGRES_USER: hejje
          POSTGRES_PASSWORD: hejje
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hejje"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the boot jar
        working-directory: server
        run: ./gradlew bootJar --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the server
        # from the repo root so ./config/*.yaml is imported, as on the VM
        env:
          HEJJE_DB_URL: jdbc:postgresql://localhost:5432/hejje
          HEJJE_DB_USER: hejje
          HEJJE_DB_PASSWORD: hejje
          HEJJE_ADMIN_PASSWORD: admin-password
          HEJJE_DATA_DIR: ${{ runner.temp }}/hejje-data
          HEJJE_MARKET_STREAM: "false"
          HEJJE_RECOMMEND_MIN_SCORE: "0"
          HEJJE_LLM_ENABLED: "true"
          HEJJE_RATINGS_ENABLED: "true"
          HEJJE_ANALOGS_ENABLED: "true"
          HEJJE_RATINGS_UNIVERSE: nifty50
          HEJJE_ANALOGS_UNIVERSE: nifty50
        run: |
          mkdir -p "$HEJJE_DATA_DIR"
          nohup java -jar server/build/libs/hejje-server-0.1.0-SNAPSHOT.jar --spring.profiles.active=dev \
            --hejje.llm.providers.fixture.type=fixture --hejje.llm.profiles.reasoning.provider=fixture \
            --hejje.llm.profiles.fast.provider=fixture > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/v1/server/ping > /dev/null 2>&1; then echo "server up after $((i * 2)) s"; exit 0; fi
            sleep 2
          done
          echo "server did not start"; tail -n 200 "$RUNNER_TEMP/server.log"; exit 1
      - name: Playwright
        working-directory: web
        run: npx playwright test --reporter=list,html --trace=retain-on-failure
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Collect the server log
        if: failure()
        run: mkdir -p web/test-results && cp "$RUNNER_TEMP/server.log" web/test-results/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
