spring:
  application:
    name: hejje
  config:
    import:
      - optional:file:./config/costs.yaml
      - optional:file:../config/costs.yaml
      - optional:classpath:costs.yaml
      - optional:file:./config/regime.yaml
      - optional:file:../config/regime.yaml
      - optional:classpath:regime.yaml
      - optional:file:./config/pulse.yaml
      - optional:file:../config/pulse.yaml
      - optional:classpath:pulse.yaml
      - optional:file:./config/events.yaml
      - optional:file:../config/events.yaml
      - optional:classpath:events.yaml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HEJJE_DB_URL:jdbc:postgresql://localhost:5432/hejje}
    username: ${HEJJE_DB_USER:hejje}
    password: ${HEJJE_DB_PASSWORD:hejje}
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # event_publication is created by Flyway (V1__baseline.sql)
      republish-outstanding-events-on-restart: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

hejje:
  mode: ${HEJJE_MODE:PAPER}
  timezone: Asia/Kolkata
  data-dir: ${HEJJE_DATA_DIR:./data}
  paper:
    slippage-bps: ${HEJJE_PAPER_SLIPPAGE_BPS:5}
    partial-fill-probability: 0.0
    starting-capital: 1000000
  broker:
    adapter: ${HEJJE_BROKER_ADAPTER:fake}
    web-url: ${HEJJE_WEB_URL:http://localhost:5173}
    zerodha:
      api-key: ${HEJJE_KITE_API_KEY:}
      api-secret: ${HEJJE_KITE_API_SECRET:}
      base-url: https://api.kite.trade
      connect-timeout: 5s
      read-timeout: 10s
    fake:
      connected: true
      starting-capital: 1000000
  security:
    encryption-key: ${HEJJE_ENCRYPTION_KEY:}
  market:
    watchlist:
      - "INDEX:NIFTY 50"
      - "INDEX:NIFTY BANK"
      - "INDEX:INDIA VIX"
      - "INDEX:NIFTY FIN SERVICE"
      - "INDEX:NIFTY IT"
      - "INDEX:NIFTY AUTO"
      - "INDEX:NIFTY PHARMA"
      - "INDEX:NIFTY FMCG"
      - "INDEX:NIFTY METAL"
      - "INDEX:NIFTY REALTY"
      - "INDEX:NIFTY MIDCAP 100"
    stream-on-startup: ${HEJJE_MARKET_STREAM:false}
    stale-after: 10s
    quote-stale-after: 5s
    tick-queue: 100000
    record: ${HEJJE_MARKET_RECORD:false}
    retention-sessions: 15
    historical-per-second: 3
  strategy:
    load-bundled: true
    bundled-dirs: ./strategies,../strategies
    aliases:
      NIFTY: "nearest_future: NIFTY"
      BANKNIFTY: "nearest_future: BANKNIFTY"
      FINNIFTY: "nearest_future: FINNIFTY"
  backtest:
    experiments:
      parallelism: 2                   # variants backtested at once (M4.7)
      max-variants: 12
    workers: 2
    warmup-days: 20
    default-risk-rupees: 2000
  recommend:
    min-score: ${HEJJE_RECOMMEND_MIN_SCORE:70}
  llm:
    enabled: ${HEJJE_LLM_ENABLED:false}
    providers:
      primary:
        type: openai-compatible
        base-url: ${HEJJE_LLM_BASE_URL:}
        api-key-env: HEJJE_LLM_API_KEY
        model: ${HEJJE_LLM_MODEL:}
    profiles:
      fast: { provider: primary }
      reasoning: { provider: primary }
      news: { provider: primary, temperature: 0.0, max-tokens: 600 }
      research: { provider: primary }
    # Native Gemini example (HEJJE_GEMINI_API_KEY in the environment):
    #   gemini: { type: gemini, api-key-env: HEJJE_GEMINI_API_KEY, model: gemini-2.5-flash }
    daily-cost-cap: ${HEJJE_LLM_DAILY_COST_CAP:}   # rupees per IST day (needs pricing); empty = no cap
    circuit-breaker:
      failure-threshold: 5
      open-for: 60s
  agent:
    ai:
      enabled: true                    # Hejje AI chat; also needs hejje.llm.enabled
      profile: reasoning               # first question of a conversation
      follow-up-profile: fast          # later questions in the same conversation
      max-steps: 8
      max-tool-result-chars: 12000
      history-turns: 10
    approvals:
      ttl: 5m                          # approvals of signal proposals expire with the signal instead
      account-autonomy-level: 3        # proposals not tied to a deployed strategy (0-3)
      expiry-sweep: 30s
  news:
    enabled: ${HEJJE_NEWS_ENABLED:false}
    poll-minutes: 5
  signals:
    enabled: true
    warmup-days: 10
    default-validity-minutes: 0
    expiry-sweep: 30s
    inline-dispatch: false
  instruments:
    sync-on-startup: false
    sync-cron: "0 0 8 * * MON-FRI"
  auth:
    admin-password: ${HEJJE_ADMIN_PASSWORD:}
    jwt-secret: ${HEJJE_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 12h
  execution:
    expected-ips: ${HEJJE_EXECUTION_EXPECTED_IPS:}
  system:
    egress:
      enabled: true
      check-interval: 5m
      resolvers: https://api.ipify.org,https://checkip.amazonaws.com
      timeout: 5s
    clock:
      enabled: true
      check-interval: 10m
      host: https://www.google.com
      max-drift: 2s
      timeout: 5s

---
spring:
  config:
    activate:
      on-profile: dev
hejje:
  llm:
    dev-fixture-endpoint: true         # POST /agents/llm/dev/fixture (only acts on type: fixture providers)
  instruments:
    sync-on-startup: true
  strategy:
    allow-forced-status: true
  execution:
    allow-off-session-paper: true
  market:
    stream-on-startup: true
    dev-candles: true
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
hejje:
  regime:
    label-on-startup: false
    universe: classpath:regime/universe-test.yaml   # five fixture equities (test resources)
  events:
    refresh-on-startup: false
  llm:
    enabled: true                      # the fixture provider only; nothing in the trading core calls it
    providers:
      fixture: { type: fixture }
    profiles:
      news: { provider: fixture, model: fixture-news }
      fast: { provider: fixture, model: fixture-fast }
      reasoning: { provider: fixture, model: fixture-reasoning }
      research: { provider: fixture, model: fixture-research }
    dev-fixture-endpoint: true
  news:
    enabled: true                      # ingest is driven by tests; the scheduler is a no-op in tests
    aliases: classpath:aliases.yaml
  strategy:
    load-bundled: false
    allow-forced-status: true
  market:
    dev-candles: true
  signals:
    inline-dispatch: true
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
management:
  server:
    port: 8081   # Prometheus and actuator stay off the Caddy-proxied port
