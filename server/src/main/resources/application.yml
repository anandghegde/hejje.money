spring:
  application:
    name: hejje
  config:
    import:
      - optional:file:./config/costs.yaml
      - optional:file:../config/costs.yaml
      - optional:classpath:costs.yaml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HEJJE_DB_URL:jdbc:postgresql://localhost:5432/hejje}
    username: ${HEJJE_DB_USER:hejje}
    password: ${HEJJE_DB_PASSWORD:hejje}
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # event_publication is created by Flyway (V1__baseline.sql)
      republish-outstanding-events-on-restart: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

hejje:
  mode: ${HEJJE_MODE:PAPER}
  timezone: Asia/Kolkata
  data-dir: ${HEJJE_DATA_DIR:./data}
  paper:
    slippage-bps: ${HEJJE_PAPER_SLIPPAGE_BPS:5}
    partial-fill-probability: 0.0
    starting-capital: 1000000
  broker:
    adapter: ${HEJJE_BROKER_ADAPTER:fake}
    web-url: ${HEJJE_WEB_URL:http://localhost:5173}
    zerodha:
      api-key: ${HEJJE_KITE_API_KEY:}
      api-secret: ${HEJJE_KITE_API_SECRET:}
      base-url: https://api.kite.trade
      connect-timeout: 5s
      read-timeout: 10s
    fake:
      connected: true
      starting-capital: 1000000
  security:
    encryption-key: ${HEJJE_ENCRYPTION_KEY:}
  market:
    watchlist:
      - "INDEX:NIFTY 50"
      - "INDEX:NIFTY BANK"
      - "INDEX:INDIA VIX"
    stream-on-startup: ${HEJJE_MARKET_STREAM:false}
    stale-after: 10s
    quote-stale-after: 5s
    tick-queue: 100000
    record: ${HEJJE_MARKET_RECORD:false}
    retention-sessions: 15
    historical-per-second: 3
  strategy:
    load-bundled: true
    bundled-dirs: ./strategies,../strategies
    aliases:
      NIFTY: "nearest_future: NIFTY"
      BANKNIFTY: "nearest_future: BANKNIFTY"
      FINNIFTY: "nearest_future: FINNIFTY"
  backtest:
    workers: 2
    warmup-days: 20
    default-risk-rupees: 2000
  recommend:
    min-score: 70
  signals:
    enabled: true
    warmup-days: 10
    default-validity-minutes: 0
    expiry-sweep: 30s
    inline-dispatch: false
  instruments:
    sync-on-startup: false
    sync-cron: "0 0 8 * * MON-FRI"
  auth:
    admin-password: ${HEJJE_ADMIN_PASSWORD:}
    jwt-secret: ${HEJJE_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 12h
  execution:
    expected-ips: ${HEJJE_EXECUTION_EXPECTED_IPS:}
  system:
    egress:
      enabled: true
      check-interval: 5m
      resolvers: https://api.ipify.org,https://checkip.amazonaws.com
      timeout: 5s
    clock:
      enabled: true
      check-interval: 10m
      host: https://www.google.com
      max-drift: 2s
      timeout: 5s

---
spring:
  config:
    activate:
      on-profile: dev
hejje:
  instruments:
    sync-on-startup: true
  strategy:
    allow-forced-status: true
  execution:
    allow-off-session-paper: true
  market:
    stream-on-startup: true
    dev-candles: true
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
hejje:
  strategy:
    load-bundled: false
    allow-forced-status: true
  market:
    dev-candles: true
  signals:
    inline-dispatch: true
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
management:
  server:
    port: 8081   # Prometheus and actuator stay off the Caddy-proxied port
