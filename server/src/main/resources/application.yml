spring:
  application:
    name: hejje
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${HEJJE_DB_URL:jdbc:postgresql://localhost:5432/hejje}
    username: ${HEJJE_DB_USER:hejje}
    password: ${HEJJE_DB_PASSWORD:hejje}
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # event_publication is created by Flyway (V1__baseline.sql)
      republish-outstanding-events-on-restart: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

hejje:
  mode: ${HEJJE_MODE:PAPER}
  timezone: Asia/Kolkata
  data-dir: ${HEJJE_DATA_DIR:./data}
  auth:
    admin-password: ${HEJJE_ADMIN_PASSWORD:}
    jwt-secret: ${HEJJE_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 12h
  execution:
    expected-ips: ${HEJJE_EXECUTION_EXPECTED_IPS:}
  system:
    egress:
      enabled: true
      check-interval: 5m
      resolvers: https://api.ipify.org,https://checkip.amazonaws.com
      timeout: 5s
    clock:
      enabled: true
      check-interval: 10m
      host: https://www.google.com
      max-drift: 2s
      timeout: 5s

---
spring:
  config:
    activate:
      on-profile: dev
hejje:
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
hejje:
  system:
    egress:
      enabled: false
    clock:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
management:
  server:
    port: 8081   # Prometheus and actuator stay off the Caddy-proxied port
