# Transaction cost rates (PRD 12.2). Percentages are fractions of turnover (0.0003 = 0.03%).
# Verified 2026-09-19 (plan M6.1) against zerodha.com/charges and NSE circular FATAX/73524 (STT from 1 April 2026,
# Finance Act 2026). Set verify=true again whenever a rate is changed without checking the live sheets.
# Loaded into hejje.costs.* (see server/src/main/resources/application.yml which imports these values).
hejje:
  costs:
    verify: false
    brokerage-flat: 20        # rupees per executed order (Zerodha); options pay it flat, other segments min(flat, pct)
    brokerage-pct: 0.0003     # 0.03%
    gst-pct: 0.18             # 18% on brokerage + exchange txn + SEBI
    sebi-pct: 0.000001        # 10 per crore
    dp-charge: 15.34          # rupees per scrip and sell day on a delivery sell, GST incl. (3.50 CDSL + 9.50 Zerodha + 2.34 GST;
                              # zerodha.com/charges, checked 2026-09-26; plan M11.1)
    equity-intraday:
      stt-pct: 0.00025        # 0.025% on sell
      stt-on-sell-only: true
      exchange-txn-pct: 0.0000307   # NSE 0.00307%
      stamp-duty-pct: 0.00003       # 0.003% buy
      brokerage-free: false
    equity-delivery:
      stt-pct: 0.001          # 0.1% both sides
      stt-on-sell-only: false
      exchange-txn-pct: 0.0000307   # NSE 0.00307%
      stamp-duty-pct: 0.00015       # 0.015% buy
      brokerage-free: true    # Zerodha equity delivery brokerage is zero
    futures:
      stt-pct: 0.0005         # 0.05% on sell (from 1 April 2026)
      stt-on-sell-only: true
      exchange-txn-pct: 0.0000183   # NSE 0.00183%
      stamp-duty-pct: 0.00002       # 0.002% buy
      brokerage-free: false
    options:
      stt-pct: 0.0015         # 0.15% on premium sell (from 1 April 2026)
      stt-on-sell-only: true
      exchange-txn-pct: 0.0003553   # NSE 0.03553% on premium
      stamp-duty-pct: 0.00003       # 0.003% buy
      brokerage-free: false
