services:
  postgres:
    image: postgres:16-alpine
    container_name: hejje-postgres-dev
    environment:
      POSTGRES_DB: hejje
      POSTGRES_USER: hejje
      POSTGRES_PASSWORD: hejje
    ports:
      - "5432:5432"
    volumes:
      - hejje-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hejje -d hejje"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hejje-pgdata-dev:
